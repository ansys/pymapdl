name: Cleanup caches 🧹
on:
  workflow_dispatch:
  pull_request:
    types:
      - closed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup caches
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Needed to delete cache entries
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Cleanup PR caches
        if: github.event_name != 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh cache delete --all --ref "refs/pull/${PR_NUMBER}/merge" --succeed-on-no-caches -R "$REPO"

      - name: Cleanup by workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            REPO: ${{ github.repository }}
        run: |
            gh cache delete --all --succeed-on-no-caches -R "$REPO"
