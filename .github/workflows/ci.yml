name: CI
run-name: "Ctrl diagnostic v25.2.0 (probe=${{ inputs.ctrl_probe }})"

on:
  workflow_dispatch:
    inputs:
      ctrl_probe:
        description: Open a fresh Ctrl connection after every test
        required: true
        type: boolean
        default: true

permissions: {}

# Keep independent dispatches; the normal CI group cancels earlier runs.
concurrency:
  group: ctrl-diagnostic-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  remote:
    name: "Remote: v25.2.0"
    permissions:
      contents: read  # Checkout the diagnostic branch
      packages: read  # Pull the private MAPDL images
    uses: $/.github/workflows/test-remote.yml
    secrets:
      license-server: ${{ secrets.LICENSE_SERVER }}
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      token: ${{ secrets.GITHUB_TOKEN }}
      username: ${{ github.actor }}
      log-encryption-key: ${{ secrets.LOG_ENCRYPTION_KEY }}
    with:
      mapdl-version: v25.2.0
      file-name: remote-v25.2.0
      upload-logs: true
      ctrl-probe: ${{ inputs.ctrl_probe }}
