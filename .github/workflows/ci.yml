name: CI
run-name: Complete historical prefix client liveness replay

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ctrl-liveness-path-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dependencies:
    name: Reuse the verified shared test dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Checkout the fixed diagnostic constraints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Record unchanged constraints identity
        run: sha256sum .ci/ctrl-path-constraints.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: ctrl-path-constraints
          path: .ci/ctrl-path-constraints.txt
          retention-days: 7

  liveness:
    name: "Liveness order: ${{ matrix.client }} / ${{ matrix.order }}"
    needs: dependencies
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - client: historical
            order: nov9-full-prefix
            selection: ctrl-order-nov9-full-prefix.txt
            ref: 94466b37e4af1b6d82c8ff782ad83659d2f753fa
          - client: current
            order: nov9-full-prefix
            selection: ctrl-order-nov9-full-prefix.txt
            ref: 154828f5ddff2a849b52bd3ed385a25db6188b02
    permissions:
      contents: read  # Checkout the exact client revision and original tests
      packages: read  # Pull the private immutable MAPDL image
    uses: $/.github/workflows/test-remote.yml
    secrets:
      license-server: ${{ secrets.LICENSE_SERVER }}
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      token: ${{ secrets.GITHUB_TOKEN }}
      username: ${{ github.actor }}
      log-encryption-key: ${{ secrets.LOG_ENCRYPTION_KEY }}
    with:
      mapdl-version: v25.2.0
      file-name: ctrl-order-${{ matrix.client }}-${{ matrix.order }}
      upload-logs: true
      client-source-ref: ${{ matrix.ref }}
      test-source-ref: 94466b37e4af1b6d82c8ff782ad83659d2f753fa
      ctrl-path-repetitions: 1
      test-selection-file: ${{ matrix.selection }}
