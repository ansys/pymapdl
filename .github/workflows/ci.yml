name: CI
run-name: State isolation baseline versus patched (three MAPDL images)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: state-isolation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  state-isolation:
    name: "State isolation: ${{ matrix.image }} / ${{ matrix.source }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: [v25.2.0, v25.2-ubuntu-cicd, v25.1.0]
        source: [baseline, patched]
    permissions:
      contents: read  # Checkout baseline and the immutable four-line test fix
      packages: read  # Pull the private MAPDL images
    uses: $/.github/workflows/test-remote.yml
    secrets:
      license-server: ${{ secrets.LICENSE_SERVER }}
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      token: ${{ secrets.GITHUB_TOKEN }}
      username: ${{ github.actor }}
      log-encryption-key: ${{ secrets.LOG_ENCRYPTION_KEY }}
    with:
      mapdl-version: ${{ matrix.image }}
      file-name: state-${{ matrix.image }}-${{ matrix.source }}
      upload-logs: true
      ctrl-probe: false
      test-source-ref: ${{ matrix.source == 'patched' && '9ecdd14c8f942c25962e19b610d4ce1ecc91eb35' || '' }}
      pytest-arguments: >-
        --random-order-bucket=none --reruns=0 --maxfail=0 tests/test_mapdl.py::test_non_interactive tests/test_mapdl.py::test_allow_ignore tests/test_mapdl.py::test_save_selection_2 tests/test_mapdl.py::test_nodes tests/test_mapdl.py::test_lssolve tests/test_mapdl.py::test_input_strings tests/test_mapdl.py::test_lsread tests/test_mapdl.py::test_input_strings_fail
