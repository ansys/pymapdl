name: "Pull Request Labeler"
on:
  pull_request:
    # opened, reopened, and synchronize are default for pull_request
    # edited - when PR title or body is changed
    # labeled - when labels are added to PR
    types: [opened, reopened, synchronize, edited, labeled]
  push:
    branches: [ main ]
    paths:
      - '.github/labels.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  label-syncer:
    # Sync the labels name, colours with the file ``labels.yml``
    name: Syncer
    # Only trusted content from main may rewrite repository labels.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write  # Needed to sync label names and colors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c #v1.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  labeler:
    name: Set labels
    if: github.event_name == 'pull_request'
    permissions:
      contents: read  # Needed to read labeler configuration
      pull-requests: write  # Needed to add labels to pull requests
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:

    # Label based on modified files
    - name: Label based on changed files
      uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 #v7.0.0
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        sync-labels: true

    # Label based on branch name
    - if: |
        startsWith(github.event.pull_request.title, 'fix') ||
        startsWith(github.event.pull_request.title, 'bug') ||
        startsWith(github.event.pull_request.title, 'patch')
      run: |
        gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "bug"

    - if: |
        startsWith(github.event.pull_request.title, 'feat')
      run: |
        gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "new feature"

    - if: |
        startsWith(github.event.pull_request.title, 'style') ||
        startsWith(github.event.pull_request.title, 'refactor') ||
        startsWith(github.event.pull_request.title, 'perf') ||
        startsWith(github.event.pull_request.title, 'test') ||
        startsWith(github.event.pull_request.title, 'chore')
      run: |
        gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "enhancement"

    - if: |
        startsWith(github.event.pull_request.title, 'build') ||
        startsWith(github.event.pull_request.title, 'revert') ||
        startsWith(github.event.pull_request.title, 'maint')
      run: |
        gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "maintenance"

    - if: |
        startsWith(github.event.pull_request.title, 'doc:') ||
        startsWith(github.event.pull_request.title, 'docs')
      run: |
        gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "documentation"

    - if: |
        startsWith(github.event.pull_request.title, 'docker') ||
        startsWith(github.event.pull_request.title, 'no-ci') ||
        startsWith(github.event.pull_request.title, 'ci')
      run: |
        gh pr edit "${PR_NUMBER}" --repo "${REPO}" --add-label "CI/CD"

  changelog-fragment:
    name: "Create changelog fragment"
    needs: [labeler]
    permissions:
      contents: write  # Needed to create changelog fragment files
      pull-requests: write  # Needed to comment on pull requests with changelog info
    runs-on: ubuntu-latest
    steps:
    - uses: ansys/actions/doc-changelog@87ff2e65e8884121f9afc97728ca9f213228ecc2 # v11.1.4
      with:
        bot-user: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
        bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
        token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
        use-pull-request-title: true  # To use the PR title instead of PR labels
