# TEMPORARY: diagnostics for concurrent Ctrl/command reply swaps. Do not merge.
name: "Diag: Remote ctrl concurrency"

on:
  push:
    branches:
      - diag/remote-v252-is-alive

permissions: {}

jobs:
  remote:
    name: "Remote: ${{ matrix.mapdl-version }} (sample ${{ matrix.sample }})"
    strategy:
      fail-fast: false
      matrix:
        mapdl-version: ["v25.2.0", "v26.1.0"]
        sample: [1, 2]
    permissions:
      contents: read  # Needed to read repository contents for tests
      packages: read  # Needed to pull Docker images from GitHub packages
    uses: ./.github/workflows/test-remote.yml
    secrets:
      license-server: ${{ secrets.LICENSE_SERVER }}
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      token: ${{ secrets.GITHUB_TOKEN }}
      username: ${{ github.actor }}
      log-encryption-key: ${{ secrets.LOG_ENCRYPTION_KEY }}
    with:
      mapdl-version: ${{ matrix.mapdl-version }}
      file-name: "diag-remote-${{ matrix.mapdl-version }}-${{ matrix.sample }}"
      upload-logs: true
      pytest-arguments: "tests/test_diag_ctrl_probe.py::test_probe_concurrent_ctrl_and_status -s --reruns=0 -o log_cli=true --log-cli-level=WARNING"
