version: 2
updates:

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Etc/UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "maintenance"
    assignees:
      - "germa89"
    commit-message:
      prefix: "build(actions)"
    cooldown:
      default-days: 7
      include:
        - "*"  # Include all dependencies in cooldown
      exclude:
        - "ansys/actions"
    groups:
       actions:
          patterns:
            - "*"

  - directories:
      - "/.github/actions/launch-mapdl-docker"
    package-ecosystem: "npm"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Etc/UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "maintenance"
      - "dependencies"
    assignees:
      - "germa89"
    commit-message:
      prefix: "build(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      include:
        - "*"  # Include all dependencies in cooldown

  - directories:
      - "/" # Location of package manifests
    package-ecosystem: "pip" # See documentation for possible values
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Etc/UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "maintenance"
      - "dependencies"
    assignees:
      - "germa89"
    commit-message:
      prefix: "build(deps)"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      include:
        - "*"  # Include all dependencies in cooldown
    exclude-paths:
      - "doc/source/examples/extended_examples/gui/**"
      - "doc/source/examples/extended_examples/hpc/**"
    groups:
       minimal:
          patterns:
            - "ansys-api-mapdl"
            - "numpy"
            - "platformdirs"
            - "psutil"

       grpc-deps:
          patterns:
            - "google*"
            - "grpc*"
            - "protobuf"

       core:
          patterns:
            - "ansys*"
            - "click"
            - "matplotlib"
            - "pexpect"
            - "pyiges"
            - "ansys-tools-visualization-interface"
            - "scipy"
            - "tqdm"
            - "vtk"
            - "tabulate"

          exclude-patterns:
            - "ansys-api-mapdl"
            - "ansys-dpf-core"
            - "pyansys-tools-report"

       documentation:
          patterns:
            - "*sphinx*"
            - "ansys-dpf-core"
            - "imageio*"
            - "jupyter*"
            - "numpydoc"
            - "pandas"
            - "plotly"
            - "pypandoc"
            - "pythreejs"

       testing:
          patterns:
            - "autopep8"
            - "pytest*"
            - "pyansys-tools-report"

          exclude-patterns:
            - "ansys-dpf-core"

       jupyter:
          patterns:
            - "ipywidgets"

       remaining:
          patterns:
            - "*"

  - directories:
      - "/doc/source/examples/extended_examples/gui"
    package-ecosystem: "pip"
    exclude-paths:
      - "doc/source/examples/extended_examples/gui/**"
      - "doc/source/examples/extended_examples/hpc/**"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Etc/UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "maintenance"
      - "dependencies"
    assignees:
      - "germa89"
    commit-message:
      prefix: "build(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      include:
        - "*"  # Include all dependencies in cooldown

  - directories:
      - "/doc/source/examples/extended_examples/hpc"
    package-ecosystem: "pip"
    exclude-paths:
      - "doc/source/examples/extended_examples/gui/**"
      - "doc/source/examples/extended_examples/hpc/**"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Etc/UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "maintenance"
      - "dependencies"
    assignees:
      - "germa89"
    commit-message:
      prefix: "build(deps)"
    groups:
      all-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      include:
        - "*"  # Include all dependencies in cooldown

  - package-ecosystem: "pre-commit"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:00"
      timezone: "Etc/UTC"
    target-branch: "main"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    cooldown:
      default-days: 7
      exclude:
        - "ansys/pre-commit-hooks/*"
    labels:
      - "maintenance"
    commit-message:
      prefix: "build(pre-commit)"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
    assignees:
      - "germa89"
